name: qrordering
description: "Aplikasi konfirmasi pesanan QR dan dapur mejaku."
publish_to: 'none'
version: 1.1.96+103

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.9.1

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Navigation
  go_router: ^15.1.2

  # Local Storage
  shared_preferences: ^2.5.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5

  # UI
  flex_color_scheme: ^8.0.2
  google_fonts: ^6.2.1
  package_info_plus: ^8.0.2
  fl_chart: ^1.0.0
  cached_network_image: ^3.4.1
  lottie: ^3.1.3
  shimmer: ^3.0.0
  pinput: ^5.0.1
  flutter_slidable: ^3.1.2
  flutter_animate: ^4.5.2
  toastification: ^2.3.0

  # Permissions (runtime — Bluetooth, kamera, notifikasi)
  permission_handler: ^11.3.1

  # HTTP — probe konektivitas (web & mobile)
  http: ^1.2.0

  # QR & Printer
  # Fork lokal menandai penggunaan API eksperimental CameraX secara eksplisit
  # agar kompatibel dengan Android lint/AGP terbaru.
  mobile_scanner:
    path: third_party/mobile_scanner
  pdf: ^3.11.3
  printing: ^5.14.2
  # Fork lokal: upstream 2.4.6 dapat crash saat koneksi langsung by-MAC
  # dilakukan sebelum halaman scan pernah dibuka (native EventSink masih null).
  bluetooth_print_plus:
    path: third_party/bluetooth_print_plus
  esc_pos_utils_plus: ^2.0.4
  image: ^4.0.17

  # Utilities
  intl: ^0.20.2
  crypto: ^3.0.7
  uuid: ^4.5.1
  connectivity_plus: ^6.1.3
  # Fork lokal menangani SecurityException bila izin notifikasi dicabut
  # setelah notifikasi terjadwal, agar receiver Android tidak crash.
  flutter_local_notifications:
    path: third_party/flutter_local_notifications
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.1
  # Nada dering kustom saat app di depan (foreground) — notif sistem sudah
  # memutar suara sendiri saat background.
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.1

# Ikon launcher dari logo brand (bukan ikon Flutter default).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ic_launcher_512.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/ic_launcher_512.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/audio/
    - .env
